# RunFlow con Postgres. Para staging/producción o una Station en Docker.
#   cp deploy/.env.compose.example .env.compose   (y cambia las contraseñas)
#   docker compose --env-file .env.compose up -d --build
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: runflow
      POSTGRES_PASSWORD: ${DB_OWNER_PASSWORD:?Define DB_OWNER_PASSWORD}
      POSTGRES_DB: runflow
      RUNFLOW_APP_DB_PASSWORD: ${DB_APP_PASSWORD:?Define DB_APP_PASSWORD}
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./deploy/postgres-init.sh:/docker-entrypoint-initdb.d/10-runflow.sh:ro
      - ./deploy/runflow-init.sql.tpl:/docker-entrypoint-initdb.d/runflow-init.sql.tpl:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U runflow']
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://runflow_app:${DB_APP_PASSWORD}@db:5432/runflow
      DATABASE_OWNER_URL: postgres://runflow:${DB_OWNER_PASSWORD}@db:5432/runflow
      DATABASE_APP_ROLE: runflow_app
      RUNFLOW_MODE: ${RUNFLOW_MODE:-cloud}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      TRUST_PROXY: ${TRUST_PROXY:-true}
      # Station enlazada con la nube (modo híbrido): déjalos vacíos para modo local.
      CLOUD_URL: ${CLOUD_URL:-}
      STATION_TOKEN: ${STATION_TOKEN:-}
    volumes:
      - app-data:/data
    ports:
      - '${APP_PORT:-3000}:3000'

volumes:
  db-data:
  app-data:
